# Vorlage für ein eigenes öffentliches Konnektor-Repository.
# Dessen Wurzel enthält ausschließlich den Inhalt von integrationen/n8n.
# Hier im Produkt-Repository wird diese Datei nicht als Workflow ausgeführt.
name: DocuFleet n8n veröffentlichen

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Freigegebener vollständiger Commit-SHA
        required: true
        type: string
      version:
        description: Freigegebene Paketversion aus package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docufleet-n8n-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-docufleet
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Exakten freigegebenen Quellstand festhalten
        env:
          ERWARTETER_COMMIT: ${{ inputs.commit }}
          ERWARTETE_VERSION: ${{ inputs.version }}
          REPOSITORY_PRIVAT: ${{ github.event.repository.private }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const paket = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.REPOSITORY_PRIVAT !== 'false') throw new Error('Ein freigegebenes öffentliches Konnektor-Repository ist erforderlich.');
          if (process.env.ERWARTETER_COMMIT !== process.env.GITHUB_SHA) throw new Error('Der Commit stimmt nicht mit der Freigabe überein.');
          if (paket.name !== 'n8n-nodes-docufleet' || paket.version !== process.env.ERWARTETE_VERSION) throw new Error('Paketname oder Version stimmt nicht.');
          if (paket.repository?.url !== `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`) throw new Error('Die öffentlichen Repository-Metadaten fehlen oder passen nicht.');
          NODE
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run build
      - name: Paket für die Veröffentlichung zusammenstellen
        run: npm pack --json > paket.json
      - name: Paketinhalt begrenzen
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const [paket] = JSON.parse(fs.readFileSync('paket.json', 'utf8'));
          const pfade = paket.files.map(datei => datei.path);
          for (const pfad of ['dist/credentials/DocuFleetApi.credentials.js', 'dist/credentials/DocuFleetWebhook.credentials.js', 'dist/nodes/DocuFleet/DocuFleet.node.js', 'dist/nodes/DocuFleet/DocuFleetTrigger.node.js', 'dist/nodes/DocuFleet/docufleet.svg']) {
            if (!pfade.includes(pfad)) throw new Error(`Paketdatei fehlt: ${pfad}`);
          }
          if (pfade.some(pfad => !pfad.startsWith('dist/') && !['package.json', 'README.md', 'LICENSE'].includes(pfad))) throw new Error('Nicht freigegebener Paketinhalt.');
          fs.writeFileSync('paket-datei.txt', paket.filename);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-nodes-docufleet
          path: '*.tgz'
      # npm Trusted Publisher muss vorab auf genau dieses Repository und diese
      # Workflow-Datei zeigen. Keine langlebigen Zugangsdaten im Quelltext.
      - name: Das zusammengestellte Paket mit Provenance veröffentlichen
        run: npm publish "$(cat paket-datei.txt)" --provenance --access public
